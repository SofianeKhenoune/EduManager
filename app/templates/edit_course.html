{% extends "base.html" %} {% block title %}Modifier le cours | EduManager{%
endblock %} {% block content %}
<section class="panel section-block">
  <div class="section-head">
    <h1>{{ course.title }}</h1>
    <a class="btn btn-secondary" href="{{ url_for('main.courses_page') }}"
      >Retour</a
    >
  </div>

  <form method="post" class="form-grid">
    <label>
      Titre *
      <input type="text" name="title" value="{{ course.title }}" required />
    </label>
    <label>
      Enseignant *
      <select name="teacher_id" required>
        <option value="">Sélectionner</option>
        {% for teacher in teachers %}
        <option value="{{ teacher.id }}" {% if course.teacher_id == teacher.id %}selected{% endif %}>{{ teacher.user.first_name }} {{ teacher.user.last_name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Bénévole (optionnel)
      <select name="volunteer_id">
        <option value="">Aucun</option>
        {% for volunteer in volunteers %}
        <option value="{{ volunteer.id }}" {% if course.volunteer_id == volunteer.id %}selected{% endif %}>{{ volunteer.user.first_name }} {{ volunteer.user.last_name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Site
      <select name="site_id">
        <option value="">Aucun</option>
        {% for site in sites %}
        <option value="{{ site.id }}" {% if course.site_id == site.id %}selected{% endif %}>{{ site.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Niveau
      <select name="level">
        <option value="">Aucun</option>
        {% for lvl in ['PREPA','NIV1','NIV2','NIV3','NIV4','NIV5','NIV6','NIV7'] %}
        <option {% if course.level == lvl %}selected{% endif %}>{{ lvl }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Jour
      <select name="day">
        <option value="">Aucun</option>
        {% for d in ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'] %}
        <option {% if course.day == d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Créneau
      <select name="time_slot" class="time-slot-select">
        <option value="">Aucun</option>
        <option value="matin" {% if course.time_slot == 'matin' %}selected{% endif %}>matin (9:00-12:15)</option>
        <option value="après-midi" {% if course.time_slot == 'après-midi' %}selected{% endif %}>après-midi (13:45-17:00)</option>
      </select>
    </label>
    <label>
      Description
      <input type="text" name="description" value="{{ course.description or '' }}" />
    </label>
    <label>
      Heure de début
      <input type="time" name="start_time" class="start-time-input" />
      <input type="hidden" name="start_hour" class="start-hour-input" value="{{ course.start_hour or '' }}" />
      <input type="hidden" name="start_minute" class="start-minute-input" />
    </label>
    <label>
      Heure de fin
      <input type="time" name="end_time" class="end-time-input" />
      <input type="hidden" name="end_hour" class="end-hour-input" value="{{ course.end_hour or '' }}" />
      <input type="hidden" name="end_minute" class="end-minute-input" />
    </label>
    <label>
      Salle
      <input type="text" name="room" value="{{ course.room or '' }}" />
    </label>
    <label>
      Capacite
      <input type="number" min="1" name="capacity" value="{{ course.capacity or 20 }}" />
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Enregistrer</button>
    </div>
  </form>
</section>

<section class="panel section-block">
  <h2>Supprimer ce cours</h2>
  {% if course.enrollments %}
  <p style="color: var(--ink-soft)">
    {{ course.enrollments|length }} inscription(s) seront aussi supprimées.
  </p>
  {% endif %}
  <form
    method="post"
    action="{{ url_for('main.delete_course', course_id=course.id) }}"
    onsubmit="return confirm('Supprimer définitivement ce cours ?');"
  >
    <div class="form-actions">
      <button class="btn btn-danger" type="submit">Supprimer le cours</button>
    </div>
  </form>
</section>
{% endblock %}
